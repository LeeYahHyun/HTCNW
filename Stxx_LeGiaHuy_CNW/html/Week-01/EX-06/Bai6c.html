<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section>
      <form action="#" method="POST">
        <fieldset>
          <legend>Registration Form</legend>

          <div>
            <label for="user-name">Name:</label>
            <input type="text" id="user-name" name="name" />
          </div>

          <div>
            <label for="user-phone">Telephone Number:</label>
            <input type="tel" id="user-phone" name="phone" />
          </div>

          <div>
            <label for="user-email">Email:</label>
            <input type="email" id="user-email" name="email" />
          </div>

          <div>
            <label for="user-color">Favorite Color:</label>
            <input
              type="color"
              id="user-color"
              name="favorite_color"
              value="#0000FF"
            />
          </div>

          <div>
            <label for="user-dob">Date of Birth:</label>
            <input type="date" id="user-dob" name="dob" value="2015-07-16" />
          </div>

          <div>
            <button type="submit">Submit</button>
          </div>
        </fieldset>
      </form>
    </section>
  </body>
</html>
