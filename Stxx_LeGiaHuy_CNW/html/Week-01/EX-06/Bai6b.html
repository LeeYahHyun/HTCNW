<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us Form</title>
    <style>
      /* Tổng thể phông chữ và căn lề toàn trang */
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #000;
      }

      /* Khung viền ngoài cùng bao bọc toàn bộ bài viết/form */
      .contact-container {
        border: 1px solid #a0b3d6; /* Đường viền xanh nhạt bên ngoài */
        padding: 0 15px 15px 15px;
        max-width: 600px; /* Giới hạn độ rộng form vừa mắt */
      }

      h1 {
        font-size: 28px;
        margin-top: 10px;
        margin-bottom: 15px;
      }

      /* Định dạng cho các nhóm trường (fieldset) */
      fieldset {
        border: 1px solid #7f7f7f;
        padding: 15px;
        margin-bottom: 15px;
      }

      legend {
        font-size: 14px;
        padding: 0 5px;
      }

      /* TẠO LAYOUT HÀNG NGANG BẰNG FLEXBOX */
      .form-row {
        display: flex;
        margin-bottom: 10px;
      }

      /* Đối với các hàng có ô nhập liệu ngắn hoặc bình thường */
      .form-row-align {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      /* Ép nhãn chữ bên trái có độ rộng cố định để thẳng hàng */
      .form-row-align label,
      .form-row label.label-left {
        width: 150px;
        flex-shrink: 0;
      }

      /* Định dạng kích thước cố định cho các ô text và textarea */
      .input-text,
      .input-textarea {
        width: 220px;
        box-sizing: border-box;
        border: 1px solid #7f7f7f;
        padding: 2px 4px;
      }

      /* Chỉnh riêng độ rộng cho khung Textarea to ra theo hình */
      .input-textarea {
        width: 400px;
        height: 150px;
        resize: none; /* Khóa không cho kéo giãn lung tung */
      }

      /* Định dạng cho hàng chứa ô Checkbox */
      .checkbox-group {
        display: flex;
        align-items: flex-start;
      }

      .checkbox-label {
        display: inline-flex;
        align-items: flex-start;
        gap: 6px;
        cursor: pointer;
      }

      .checkbox-label input {
        margin: 3px 0 0 0;
      }

      /* Kiểu dáng nút bấm gửi tin nhắn */
      .btn-submit {
        background-color: #f0f0f0;
        border: 1px solid #7f7f7f;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 14px;
      }
      .btn-submit:hover {
        background-color: #e5e5e5;
      }
    </style>
  </head>
  <body>
    <article class="contact-container">
      <form action="" method="post">
        <h1>Contact Us</h1>

        <fieldset>
          <legend>Your message:</legend>

          <div class="form-row-align">
            <label for="to">To</label>
            <input
              type="text"
              id="to"
              value="Example Cafe"
              class="input-text"
            />
          </div>

          <div class="form-row-align">
            <label for="email">Your email</label>
            <input type="text" id="email" class="input-text" />
          </div>

          <div class="form-row">
            <label for="message" class="label-left">Message</label>
            <textarea
              name="message"
              id="message"
              class="input-textarea"
            ></textarea>
          </div>

          <div class="form-row-align">
            <label for="file">Attach File</label>
            <input type="file" id="file" />
          </div>
        </fieldset>

        <fieldset>
          <legend>How you found us:</legend>

          <div class="form-row-align">
            <label for="hear">How did you hear of us</label>
            <select id="hear" name="hear" class="input-text">
              <option value="google">Google</option>
              <option value="facebook">Facebook</option>
              <option value="tiktok">Tiktok</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-row checkbox-group">
            <span class="label-left">Newsletter</span>
            <label class="checkbox-label">
              <input type="checkbox" name="newsletter" value="yes" checked />
              Ensure this box is checked if you would like to receive email
              updates
            </label>
          </div>
        </fieldset>

        <button type="submit" class="btn-submit">Send message</button>
      </form>
    </article>
  </body>
</html>
