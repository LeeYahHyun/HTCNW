<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap-grid.min.css"
    />
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
      }

      /* ===== NAVBAR ===== */
      .navbar-dark {
        background-color: #16374a;
        padding: 15px 30px;
      }
      .navbar-dark .navbar-brand {
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .navbar-dark .nav-link {
        color: rgba(255, 255, 255, 0.85);
        font-weight: 600;
        font-size: 14px;
      }
      .navbar-dark .nav-link:hover {
        color: #fff;
      }
      .btn-download {
        background-color: #2196f3;
        color: #fff;
        border: none;
        font-weight: 600;
        padding: 8px 18px;
      }

      /* ===== HERO SECTION ===== */
      .hero-section {
        background-color: #16374a;
        color: #fff;
        padding: 60px 60px 80px;
      }
      .hero-title {
        text-align: center;
        font-size: 48px;
        font-weight: 300;
        margin-bottom: 50px;
      }
      .hero-image img {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border-radius: 4px;
      }
      .btn-new-menu {
        background-color: #ff2d78;
        color: #fff;
        border: none;
        font-weight: 600;
        padding: 14px 0;
        width: 220px;
      }
      .btn-terrace {
        background-color: transparent;
        color: #fff;
        border: 1px solid #fff;
        font-weight: 600;
        padding: 14px 0;
        width: 220px;
      }
      .hero-text {
        color: rgba(255, 255, 255, 0.8);
        font-size: 15px;
        line-height: 1.7;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="navbar navbar-dark">
      <div class="container-fluid">
        <div class="row w-100 align-items-center">
          <div class="col-3">
            <a class="navbar-brand" href="#">RESTAURANT TEMPLATE</a>
          </div>
          <div class="col-3">
            <ul class="nav">
              <li class="nav-item">
                <a class="nav-link" href="#">BLOCK DEMOS 1</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">BLOCK DEMOS 2</a>
              </li>
            </ul>
          </div>
          <div class="col-3">
            <ul class="nav">
              <li class="nav-item">
                <a class="nav-link" href="#">SITE TEMPLATES 1</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">SITE TEMPLATES 2</a>
              </li>
            </ul>
          </div>
          <div class="col-3 text-end">
            <button class="btn btn-download" type="button">
              DOWNLOAD NOW!
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- HERO SECTION -->
    <div class="hero-section">
      <h1 class="hero-title">Restaurant</h1>

      <div class="row align-items-center">
        <!-- Left: Image -->
        <div class="col-6 hero-image">
          <img
            src="/HTCNW/Stxx_LeGiaHuy_CNW/img/Tuan5/Bai1/images (7).jpg"
            alt="Pizza"
          />
        </div>

        <!-- Right: Buttons + Text -->
        <div class="col-6">
          <div class="d-flex flex-column align-items-start ps-5">
            <button class="btn btn-new-menu mb-3" type="button">
              New Menu
            </button>
            <button class="btn btn-terrace mb-3" type="button">Terrace</button>
            <p class="hero-text">
              The restaurant area allowed to accommodate a banquet hall, and a
              children hall, where children and their parents can fully enjoy
              the most interesting animation programs.
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="/HTCNW/Stxx_LeGiaHuy_CNW/js/js-bootstap/bootstrap.bundle.min.js"></script>
  </body>
</html>
