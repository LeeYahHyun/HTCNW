<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feane - Book A Table</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #ffbe33;
        --dark: #222831;
      }
      body {
        font-family: "Open Sans", sans-serif;
        background: #fff;
        color: var(--dark);
      }
      .site-nav {
        background: linear-gradient(90deg, #000 60%, #222831 100%);
      }
      .brand {
        font-family: "Dancing Script", cursive;
        font-size: 1.8rem;
        font-weight: 700;
        color: #fff;
      }
      .navbar-nav .nav-link {
        color: #fff;
        font-size: 0.85rem;
        padding: 0.5rem 1.1rem;
      }
      .navbar-nav .nav-link:hover,
      .navbar-nav .nav-link.active {
        color: var(--accent);
      }
      .nav-icons a.icon {
        color: #fff;
        margin-right: 1rem;
      }
      .nav-icons a.icon:hover {
        color: var(--accent);
      }
      .btn-accent {
        background: var(--accent);
        color: #fff;
        border: 2px solid var(--accent);
        border-radius: 45px;
        padding: 0.4rem 1.6rem;
        font-weight: 600;
      }
      .btn-accent:hover {
        background: transparent;
        color: var(--accent);
      }
      .script {
        font-family: "Dancing Script", cursive;
        font-weight: 700;
      }

      .book-title {
        font-size: 2.2rem;
      }
      .form-control,
      .form-select {
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        font-size: 0.85rem;
      }
      .form-control:focus,
      .form-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 0.2rem rgba(255, 190, 51, 0.25);
      }
      .map-box iframe {
        width: 100%;
        height: 100%;
        min-height: 300px;
        border: 0;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark site-nav py-3">
      <div class="container">
        <a class="navbar-brand brand" href="index.html">Feane</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav mx-auto text-uppercase">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="menu.html">Menu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="book.html">Book Table</a>
            </li>
          </ul>
          <div class="nav-icons d-flex align-items-center">
            <a href="#" class="icon" aria-label="Tài khoản"
              ><i class="bi bi-person-fill"></i
            ></a>
            <a href="#" class="icon" aria-label="Giỏ hàng"
              ><i class="bi bi-cart-fill"></i
            ></a>
            <a href="#" class="icon" aria-label="Tìm kiếm"
              ><i class="bi bi-search"></i
            ></a>
            <a href="order.html" class="btn btn-accent btn-sm ms-2"
              >Order Online</a
            >
          </div>
        </div>
      </div>
    </nav>

    <section class="py-5">
      <div class="container py-4">
        <div class="border rounded p-4 p-md-5">
          <div class="row g-4">
            <div class="col-lg-6">
              <h2 class="script book-title mb-4">Book A Table</h2>
              <form id="bookForm" novalidate>
                <div class="mb-3">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Your Name"
                    required
                  />
                </div>
                <div class="mb-3">
                  <input
                    type="tel"
                    class="form-control"
                    placeholder="Phone Number"
                    required
                  />
                </div>
                <div class="mb-3">
                  <input
                    type="email"
                    class="form-control"
                    placeholder="Your Email"
                    required
                  />
                </div>
                <div class="mb-3">
                  <select class="form-select" required>
                    <option value="" selected disabled>
                      How many persons?
                    </option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5+</option>
                  </select>
                </div>
                <div class="mb-4">
                  <input type="date" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-accent">Book Now</button>
              </form>
            </div>
            <div class="col-lg-6 map-box">
              <iframe
                title="Bản đồ nhà hàng"
                loading="lazy"
                src="https://maps.google.com/maps?q=Ho%20Chi%20Minh%20City&t=k&z=15&output=embed"
              ></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("bookForm").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("Đặt bàn thành công!");
        e.target.reset();
      });
    </script>
  </body>
</html>
