<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap-grid.css"
    />
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap-grid.min.css"
    />
    <style>
      .right-col > .row {
        height: 50%;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid p-0 main-box">
      <div class="row g-0 h-100">
        <!-- Cột trái (col-4 hoặc col-6 tùy bạn chọn) -->
        <div class="col-4">
          <img
            src="/HTCNW/Stxx_LeGiaHuy_CNW/img/Tuan4/Bai1/900w-iSucd-62myg.webp"
            alt=""
          />
        </div>

        <!-- Cột phải: Thêm class "right-col" đã định nghĩa ở trên -->
        <div class="col-8 right-col">
          <!-- Hàng trên: Chứa 2 ảnh -->
          <div class="row g-0">
            <div class="col-6">
              <img
                src="/HTCNW/Stxx_LeGiaHuy_CNW/img/Tuan4/Bai1/download.jpg"
                alt=""
              />
            </div>
            <div class="col-6">
              <img
                src="/HTCNW/Stxx_LeGiaHuy_CNW/img/Tuan4/Bai1/hinh-nen-buon-1.jpg"
                alt=""
              />
            </div>
          </div>

          <!-- Hàng dưới: Chứa 3 ảnh -->
          <div class="row g-0">
            <div class="col-4">
              <img
                src="/HTCNW/Stxx_LeGiaHuy_CNW/img/Tuan4/Bai1/images.jpg"
                alt=""
              />
            </div>
            <div class="col-4">
              <img
                src="/HTCNW/Stxx_LeGiaHuy_CNW/img/Tuan4/Bai1/images (2).jpg"
                alt=""
              />
            </div>
            <div class="col-4">
              <img
                src="/HTCNW/Stxx_LeGiaHuy_CNW/img/Tuan4/Bai1/images (1).jpg"
                alt=""
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
