<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap.min.css"
    />
    <style>
      .row {
        padding-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container border p-3 mt-3">
      <div class="form">
        <div class="row">
          <div class="col-7">
            <label for="" class="form-label">Username*</label>
          </div>
          <div class="col-5">
            <label for="" class="form-label">Company name*</label>
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <input
              type="text"
              class="form-control"
              placeholder="Choose your username"
            />
          </div>
          <div class="col-5">
            <input
              type="text"
              class="form-control"
              placeholder="your company name"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <label for="" class="form-label">E-mail*</label>
          </div>
          <div class="col-5">
            <label for="" class="form-label">Category*</label>
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <input
              type="text"
              class="form-control"
              placeholder="Your current email address"
            />
          </div>
          <div class="col-5">
            <input
              type="text"
              class="form-control"
              placeholder="skills catagory"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <label for="" class="form-label">Password*</label>
          </div>
          <div class="col-5">
            <label for="" class="form-label">Contact number*</label>
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <input
              type="text"
              class="form-control"
              placeholder="Create a password"
            />
          </div>
          <div class="col-5">
            <input
              type="text"
              class="form-control"
              placeholder="provide your number"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <label for="" class="form-label">Full name*</label>
          </div>
          <div class="col-5">
            <label for="" class="form-label">Your Location*</label>
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <input
              type="text"
              class="form-control"
              placeholder="Your Frist name and Last name"
            />
          </div>
          <div class="col-5">
            <input
              type="text"
              class="form-control"
              placeholder="Your Pincode and City"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-7">
            <label for="genders" class="form-label">Gender*</label>
          </div>
          <div class="col-5 d-flex flex-row">
            <input type="checkbox" class="form-check" />
            <label for="" class="form-check"
              >Agree with the terms and conditions</label
            >
          </div>
        </div>
        <div class="row">
          <div class="col-7 d-flex flex-row">
            <input type="radio" class="form-check" />
            <label for="" class="form-check-label">Male</label>
            <input type="radio" class="form-check" />
            <label for="" class="form-check-label">FeMail</label>
          </div>
          <div class="col-5"></div>
        </div>
        <div class="row">
          <div class="col-7"></div>
          <div class="col-5">
            <button class="btn btn-success" type="submit">Signup</button>
            <span class="text-sm">or</span>
            <button class="btn btn-primary" type="submit">
              Sign up with Facebook
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
