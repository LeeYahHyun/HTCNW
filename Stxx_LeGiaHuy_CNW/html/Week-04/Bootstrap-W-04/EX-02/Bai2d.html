<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Form Validation</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap.css"
    />
  </head>
  <body class="p-5 bg-light">
    <div
      class="container bg-white p-4 border rounded shadow-sm"
      style="max-width: 700px"
    >
      <!-- Form chứa class 'needs-validation' và 'novalidate' -->
      <form class="row g-3 needs-validation" novalidate>
        <!-- First name -->
        <div class="col-md-4">
          <label for="validationCustom01" class="form-label font-weight-bold"
            >First name</label
          >
          <input
            type="text"
            class="form-control"
            id="validationCustom01"
            value="Mark"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <!-- Last name -->
        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Last name</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom02"
            value="Otto"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <!-- Username -->
        <div class="col-md-4">
          <label for="validationCustomUsername" class="form-label"
            >Username</label
          >
          <div class="input-group has-validation">
            <span class="input-group-text" id="inputGroupPrepend">@</span>
            <input
              type="text"
              class="form-control"
              id="validationCustomUsername"
              placeholder="Username"
              aria-describedby="inputGroupPrepend"
              required
            />
            <div class="invalid-feedback">Please choose a username.</div>
          </div>
        </div>

        <!-- City -->
        <div class="col-md-6">
          <label for="validationCustom03" class="form-label">City</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom03"
            placeholder="City"
            required
          />
          <div class="invalid-feedback">Please provide a valid city.</div>
        </div>

        <!-- State -->
        <div class="col-md-3">
          <label for="validationCustom04" class="form-label">State</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom04"
            placeholder="State"
            required
          />
          <div class="invalid-feedback">Please provide a valid state.</div>
        </div>

        <!-- Zip -->
        <div class="col-md-3">
          <label for="validationCustom05" class="form-label">Zip</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom05"
            placeholder="Zip"
            required
          />
          <div class="invalid-feedback">Please provide a valid zip.</div>
        </div>

        <!-- Checkbox -->
        <div class="col-12">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="invalidCheck"
              required
            />
            <label class="form-check-label" for="invalidCheck">
              Agree to terms and conditions
            </label>
            <div class="invalid-feedback">
              You must agree before submitting.
            </div>
          </div>
        </div>

        <!-- Button Submit -->
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Submit form</button>
        </div>
      </form>
    </div>

    <!-- Đoạn Script BẮT BUỘC để kích hoạt đổi màu viền và hiện chữ thông báo lỗi -->
    <script>
      (() => {
        "use strict";
        const forms = document.querySelectorAll(".needs-validation");
        Array.from(forms).forEach((form) => {
          form.addEventListener(
            "submit",
            (event) => {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }
              form.classList.add("was-validated");
            },
            false,
          );
        });
      })();
    </script>
  </body>
</html>
