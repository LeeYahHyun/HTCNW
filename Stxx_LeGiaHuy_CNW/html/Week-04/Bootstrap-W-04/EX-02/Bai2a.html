<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap-grid.min.css"
    />
    <link
      rel="stylesheet"
      href="/HTCNW/Stxx_LeGiaHuy_CNW/html/css-bootstrap/bootstrap.min.css"
    />
    <style>
      .no-border-pd1 th,
      .no-border-pd1 td,
      .no-border-total th,
      .no-border-total td {
        border-bottom: none;
      }
      .bg {
        background-color: rgba(213, 229, 240, 0.53);
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container border p-3 mt-5">
      <div class="bg">
        <h4>Checkout</h4>
        <hr />
        <table class="table table-hover">
          <tbody>
            <tr class="no-border-pd1">
              <th class="fs-5">
                Product 1<br />
                <small class="text-muted">Lorem ipsum dolor sit amet</small>
              </th>
              <td>$200</td>
            </tr>
            <tr>
              <th class="text-muted">
                Product 2<br /><small class="fs-6"
                  >Lorem ipsum dolor sit amet</small
                >
              </th>
              <td>$120</td>
            </tr>
            <tr class="no-border-total">
              <th class="fs-5">Total</th>
              <td>$320</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="mt-4">
        <h4>Credit Card Details</h4>
        <hr />
        <form>
          <div class="row g-3">
            <!-- Hàng label -->
            <div class="col-8">
              <label class="form-label text-muted small">CARD HOLDER</label>
            </div>
            <div class="col-4">
              <label class="form-label text-muted small">EXPIRATION DATE</label>
            </div>

            <!-- Hàng input: Card Holder + MM / YY -->
            <div class="col-8">
              <input
                type="text"
                class="form-control"
                id="cardHolder"
                placeholder="Card Holder"
              />
            </div>
            <div class="col-4">
              <div class="d-flex align-items-center gap-2">
                <input
                  type="text"
                  class="form-control"
                  id="expMonth"
                  placeholder="MM"
                />
                <span class="fs-5">/</span>
                <input
                  type="text"
                  class="form-control"
                  id="expYear"
                  placeholder="YY"
                />
              </div>
            </div>

            <!-- Hàng label -->
            <div class="col-8">
              <label class="form-label text-muted small">CARD NUMBER</label>
            </div>
            <div class="col-4">
              <label class="form-label text-muted small">CVC</label>
            </div>

            <!-- Hàng input: Card Number + CVC -->
            <div class="col-8">
              <input
                type="text"
                class="form-control"
                id="cardNumber"
                placeholder="Card Number"
              />
            </div>
            <div class="col-4">
              <input
                type="text"
                class="form-control"
                id="cvc"
                placeholder="CVC"
              />
            </div>

            <!-- Nút Proceed -->
            <div class="col-12 mt-4">
              <button class="btn btn-primary w-100 py-2" type="submit">
                Proceed
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
